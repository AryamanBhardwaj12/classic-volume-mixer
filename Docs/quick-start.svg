<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
<rect width="1000" height="320" rx="20" fill="#f4f7fc"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#18253b">
<text x="32" y="42" font-size="24" font-weight="700">Classic Volume Mixer — quick setup</text>
<g transform="translate(24 65)"><rect width="304" height="230" rx="14" fill="white"/><circle cx="30" cy="31" r="17" fill="#0067c0"/><text x="25" y="37" fill="white" font-size="18">1</text><text x="58" y="38" font-size="20" font-weight="600">Download and extract</text><path d="M85 70h52l16 15h66v76H85z" fill="#ffcd65"/><rect x="142" y="85" width="14" height="76" fill="#c18d2f"/><path d="M149 95v52" stroke="white" stroke-width="4" stroke-dasharray="4 4"/><text x="24" y="191" font-size="16">Download the release ZIP.</text><text x="24" y="215" font-size="16">Right-click it → Extract All.</text></g>
<g transform="translate(348 65)"><rect width="304" height="230" rx="14" fill="white"/><circle cx="30" cy="31" r="17" fill="#0067c0"/><text x="25" y="37" fill="white" font-size="18">2</text><text x="58" y="38" font-size="20" font-weight="600">Double-click Install</text><rect x="47" y="75" width="210" height="80" rx="9" fill="#eaf3ff" stroke="#a8c9ef"/><rect x="63" y="95" width="33" height="34" rx="4" fill="#26384b"/><text x="68" y="118" font-size="19" fill="white">&gt;_</text><text x="111" y="118" font-size="18" font-weight="600">Install.cmd</text><text x="24" y="191" font-size="16">Open the extracted folder.</text><text x="24" y="215" font-size="16">No administrator needed.</text></g>
<g transform="translate(672 65)"><rect width="304" height="230" rx="14" fill="white"/><circle cx="30" cy="31" r="17" fill="#0067c0"/><text x="25" y="37" fill="white" font-size="18">3</text><text x="58" y="38" font-size="20" font-weight="600">Show the speaker</text><rect x="22" y="88" width="260" height="51" rx="7" fill="#0067c0"/><text x="152" y="119" font-size="18" text-anchor="middle" fill="white">Show my speaker icon</text><text x="24" y="191" font-size="16">Click the blue setup button.</text><text x="24" y="215" font-size="16">Then click the tray speaker.</text></g></g></svg>
